<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timezone Converter</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- PAGE TITLE HEADER ON TOP -->
    <header class="page-header">
      <div class="brand-badge">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </span>
        <h1 class="app-title">World Timezone Converter</h1>
      </div>
      <p class="app-subtitle">Compare local time, UTC offsets, and 24-hour overlap across cities worldwide</p>
    </header>

    <!-- COMPACT CONTROLS BAR -->
    <div class="topbar">
      <span class="topbar-label">Quick Controls</span>
      <div class="toolbar">
        <div class="step-group" role="group" aria-label="Quick time adjustment">
          <button type="button" id="btnMinus1h" class="btn-step" title="Subtract 1 hour">-1h</button>
          <button type="button" id="btnNow" class="btn-step" title="Reset to current time">Now</button>
          <button type="button" id="btnPlus1h" class="btn-step" title="Add 1 hour">+1h</button>
        </div>

        <div class="segmented-toggle" id="formatToggle" role="group" aria-label="Time format">
          <button type="button" id="btn12h" class="seg-option is-active" aria-pressed="true">12h</button>
          <button type="button" id="btn24h" class="seg-option" aria-pressed="false">24h</button>
        </div>

        <button type="button" id="btnTheme" class="btn-tool" title="Switch Light / Dark theme">
          <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span id="themeLabel">Dark</span>
        </button>
      </div>
    </div>

    <!-- SIDE-BY-SIDE (DESKTOP) / STACKED (MOBILE) CONVERTER GRID -->
    <div class="converter-grid">
      <!-- FROM PANEL -->
      <section class="panel" aria-label="From Timezone">
        <div class="panel-top">
          <div class="panel-header">
            <div class="panel-badge-group">
              <span class="panel-label">From</span>
              <span id="fromTod" class="tod-pill tod-day">Day</span>
            </div>
            <span id="fromOffset" class="offset-pill">UTC+00:00</span>
          </div>

          <div class="tz-combobox" id="fromCombo">
            <input type="hidden" id="fromTz" value="UTC">
            <div class="combo-control">
              <svg class="combo-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
              </svg>
              <input
                type="text"
                id="fromSearch"
                class="combo-input"
                placeholder="Search city, country, or UTC..."
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="fromList"
                aria-label="From Timezone"
              >
              <button type="button" id="fromClear" class="btn-clear" title="Clear search" aria-label="Clear search" tabindex="-1" hidden>
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
              <button type="button" id="fromToggle" class="btn-chevron" title="Toggle timezone list" aria-label="Toggle timezone list" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
            <div id="fromList" class="combo-dropdown" role="listbox" aria-label="From Timezone options" hidden></div>
          </div>
        </div>

        <div class="panel-bottom">
          <div class="datetime-grid">
            <div class="input-group">
              <label for="dateInput" class="input-label">Date</label>
              <input type="date" id="dateInput" class="dt-input" required>
            </div>

            <div class="input-group">
              <label for="timeInput" class="input-label">Time</label>
              <input type="time" id="timeInput" class="dt-input" step="60" required>
            </div>
          </div>

          <div class="source-summary">
            <span id="fromFormattedDate">---</span>
            <span id="fromZoneShort" class="zone-tag">---</span>
          </div>
        </div>
      </section>

      <!-- SWAP BUTTON -->
      <div class="swap-col">
        <button type="button" id="btnSwap" class="btn-swap" title="Swap From and To timezones" aria-label="Swap From and To timezones">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10l-4-4 4-4"/>
            <path d="M3 6h18"/>
            <path d="M17 14l4 4-4 4"/>
            <path d="M21 18H3"/>
          </svg>
        </button>
      </div>

      <!-- TO PANEL -->
      <section class="panel" aria-label="To Timezone">
        <div class="panel-top">
          <div class="panel-header">
            <div class="panel-badge-group">
              <span class="panel-label">To</span>
              <span id="toTod" class="tod-pill tod-day">Day</span>
            </div>
            <span id="toOffset" class="offset-pill">UTC+00:00</span>
          </div>

          <div class="tz-combobox" id="toCombo">
            <input type="hidden" id="toTz" value="UTC">
            <div class="combo-control">
              <svg class="combo-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
              </svg>
              <input
                type="text"
                id="toSearch"
                class="combo-input"
                placeholder="Search city, country, or UTC..."
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="toList"
                aria-label="To Timezone"
              >
              <button type="button" id="toClear" class="btn-clear" title="Clear search" aria-label="Clear search" tabindex="-1" hidden>
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
              <button type="button" id="toToggle" class="btn-chevron" title="Toggle timezone list" aria-label="Toggle timezone list" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
            <div id="toList" class="combo-dropdown" role="listbox" aria-label="To Timezone options" hidden></div>
          </div>
        </div>

        <div class="panel-bottom" aria-live="polite">
          <div class="result-primary">
            <div class="result-time-group">
              <span id="resultTime" class="result-time">--:--</span>
              <span id="resultPeriod" class="result-period" hidden>AM</span>
            </div>

            <div class="result-actions">
              <span id="diffBadge" class="diff-badge">0h</span>
              <button type="button" id="btnCopy" class="btn-copy" title="Copy converted time and date">
                <svg id="copyIcon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <span id="copyLabel">Copy</span>
              </button>
            </div>
          </div>

          <div class="result-meta">
            <span id="resultDate">---</span>
            <div class="result-tags">
              <span id="dayShift" class="day-shift" hidden>Same day</span>
              <span id="toZoneShort" class="zone-tag">---</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 24-HOUR INTERACTIVE TIMELINE SCRUBBER -->
    <section class="timeline-card" aria-label="24-Hour Timeline">
      <div class="timeline-header">
        <span class="timeline-title">24h Comparison</span>
        <div class="timeline-legend">
          <span class="legend-item"><i class="legend-dot dot-work"></i>Overlap (9–17)</span>
          <span class="legend-item"><i class="legend-dot dot-day"></i>Awake</span>
          <span class="legend-item"><i class="legend-dot dot-night"></i>Night</span>
        </div>
      </div>
      <div class="timeline-scroll" id="timelineScroll">
        <div id="timelineGrid" class="timeline-grid"></div>
      </div>
    </section>
  </main>
</body>
</html>
